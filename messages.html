<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><title>Messages | ROBOT.</title><link rel="stylesheet" href="style.css"></head><body><div id="robotMenu"></div><main class="page-shell"><header class="page-header"><div><p class="eyebrow">MESSAGING</p><h1>Messages</h1><p class="page-description">Send a note to your desk robot.</p></div></header><section class="glass-card composer-card"><label class="eyebrow" for="messageInput">NEW MESSAGE</label><textarea id="messageInput" rows="4" maxlength="500" placeholder="Type a message for your robot..."></textarea><div class="composer-footer"><span class="form-note" id="messageFeedback" aria-live="polite">Messages are stored in this page only.</span><button class="primary-button" id="sendMessage">Send Message</button></div></section><section class="history-section"><div class="section-heading"><div><p class="eyebrow">MESSAGE HISTORY</p><h2>Recent messages</h2></div><button class="quiet-button" id="clearHistory">Clear history</button></div><div class="message-list" id="messageHistory" aria-live="polite"></div></section></main>
<script>
const history = document.getElementById('messageHistory'), input = document.getElementById('messageInput');
const seed = [{text:'Ready when you are.',time:'Today · 09:12',direction:'received'},{text:'Good morning, robot.',time:'Today · 09:10',direction:'sent'},{text:'System check complete.',time:'Yesterday · 18:42',direction:'received'}];
let messages = [...seed];
function sendRobotMessage(message) {
  if (!window.robotControl) throw new Error('Menu API is still loading.');
  return window.robotControl.request('/api/message', { message });
}
function renderMessages() { history.replaceChildren(); if (!messages.length) { const empty=document.createElement('div'); empty.className='empty-state glass-card'; empty.textContent='No messages yet. Send your first note above.'; history.append(empty); return; }
  messages.forEach(item => { const card=document.createElement('article'); card.className=`message-item glass-card ${item.direction}`; const marker=document.createElement('span'); marker.className='message-marker'; marker.setAttribute('aria-hidden','true'); const body=document.createElement('div'), text=document.createElement('p'), meta=document.createElement('div'); text.className='message-text'; text.textContent=item.text; meta.className='message-meta'; meta.textContent=`${item.direction === 'sent' ? 'Sent' : 'Received'} · ${item.time}`; body.append(text,meta); card.append(marker,body); history.append(card); });
}
document.getElementById('sendMessage').addEventListener('click', async () => { const text=input.value.trim(),feedback=document.getElementById('messageFeedback'); if (!text) { input.focus(); feedback.textContent='Enter a message before sending.'; return; } try { await sendRobotMessage(text); messages.unshift({text,time:new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(new Date()),direction:'sent'}); input.value=''; feedback.textContent='Message sent to the robot.'; feedback.classList.remove('error-text'); renderMessages(); } catch(error) { feedback.textContent=error.message; feedback.classList.add('error-text'); } });
input.addEventListener('keydown', event => { if (event.key==='Enter' && !event.shiftKey) { event.preventDefault(); document.getElementById('sendMessage').click(); } });
document.getElementById('clearHistory').addEventListener('click', () => { messages=[]; renderMessages(); });
renderMessages(); loadRobotMenu();
async function loadRobotMenu(){try{const r=await fetch('menu.html');if(!r.ok)throw Error();const template=document.createElement('template');template.innerHTML=await r.text();const menuScript=template.content.querySelector('script');if(menuScript)menuScript.remove();document.getElementById('robotMenu').replaceChildren(template.content.cloneNode(true));if(menuScript){const script=document.createElement('script');script.textContent=menuScript.textContent;document.body.append(script);script.remove();}}catch{document.getElementById('robotMenu').innerHTML='<p class="menu-error">Navigation could not load. Run this page using VS Code Live Server.</p>';}}
</script></body></html>
