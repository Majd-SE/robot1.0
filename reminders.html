<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><title>Reminders | ROBOT.</title><link rel="stylesheet" href="style.css"></head><body><div id="robotMenu"></div><main class="page-shell"><header class="page-header"><div><p class="eyebrow">PRODUCTIVITY</p><h1>Reminders</h1><p class="page-description">Keep the small things in view.</p></div></header><section class="glass-card reminder-form"><div class="section-heading"><div><p class="eyebrow">ADD REMINDER</p><h2>Plan a moment</h2></div></div><form id="reminderForm"><label class="field-label" for="reminderTitle">Reminder title</label><input id="reminderTitle" name="title" type="text" maxlength="100" placeholder="What should you remember?" required><div class="date-fields"><div><label class="field-label" for="reminderDate">Date</label><input id="reminderDate" name="date" type="date" required></div><div><label class="field-label" for="reminderTime">Time</label><input id="reminderTime" name="time" type="time" required></div></div><button class="primary-button" type="submit">Add Reminder</button></form></section><section class="history-section"><div class="section-heading"><div><p class="eyebrow">UPCOMING REMINDERS</p><h2>Your reminders</h2></div><span class="count-pill" id="reminderCount">0</span></div><div class="reminder-list" id="reminderList"></div></section></main>
<script>
const storageKey='robot-control-reminders'; let reminders=[]; try { reminders=JSON.parse(localStorage.getItem(storageKey)||'[]'); if(!Array.isArray(reminders)) reminders=[]; } catch { reminders=[]; }
const list=document.getElementById('reminderList');
function saveReminders(){localStorage.setItem(storageKey,JSON.stringify(reminders));}
function renderReminders(){list.replaceChildren(); const upcoming=reminders.filter(item=>!item.complete).sort((a,b)=>`${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`)); const done=reminders.filter(item=>item.complete); const shown=[...upcoming,...done]; document.getElementById('reminderCount').textContent=upcoming.length;
if(!shown.length){const empty=document.createElement('div');empty.className='empty-state glass-card';empty.innerHTML='<span class="empty-mark" aria-hidden="true">＋</span><strong>No reminders yet</strong><span>Add a reminder above and it will appear here.</span>';list.append(empty);return;}
shown.forEach(item=>{const card=document.createElement('article');card.className=`reminder-item glass-card${item.complete?' is-complete':''}`;const check=document.createElement('button');check.className='complete-button';check.type='button';check.setAttribute('aria-label',item.complete?'Mark incomplete':'Mark complete');check.setAttribute('aria-pressed',String(item.complete));check.textContent=item.complete?'✓':'';check.addEventListener('click',()=>{item.complete=!item.complete;saveReminders();renderReminders();});const content=document.createElement('div'),title=document.createElement('h3'),datetime=document.createElement('p');title.textContent=item.title;datetime.className='reminder-datetime';datetime.textContent=new Intl.DateTimeFormat(undefined,{dateStyle:'medium'}).format(new Date(`${item.date}T12:00:00`))+' · '+item.time;content.append(title,datetime);const del=document.createElement('button');del.className='delete-button';del.type='button';del.textContent='Delete';del.setAttribute('aria-label',`Delete ${item.title}`);del.addEventListener('click',()=>{reminders=reminders.filter(reminder=>reminder.id!==item.id);saveReminders();renderReminders();});card.append(check,content,del);list.append(card);});}
document.getElementById('reminderForm').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget),title=String(data.get('title')).trim();if(!title){document.getElementById('reminderTitle').setCustomValidity('Enter a reminder title.');document.getElementById('reminderTitle').reportValidity();return;}document.getElementById('reminderTitle').setCustomValidity('');reminders.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,date:data.get('date'),time:data.get('time'),complete:false});saveReminders();event.currentTarget.reset();renderReminders();});document.getElementById('reminderTitle').addEventListener('input',event=>event.currentTarget.setCustomValidity(''));renderReminders();
loadRobotMenu();
async function loadRobotMenu(){try{const r=await fetch('menu.html');if(!r.ok)throw Error();const template=document.createElement('template');template.innerHTML=await r.text();const menuScript=template.content.querySelector('script');if(menuScript)menuScript.remove();document.getElementById('robotMenu').replaceChildren(template.content.cloneNode(true));if(menuScript){const script=document.createElement('script');script.textContent=menuScript.textContent;document.body.append(script);script.remove();}}catch{document.getElementById('robotMenu').innerHTML='<p class="menu-error">Navigation could not load. Run this page using VS Code Live Server.</p>';}}
</script></body></html>
