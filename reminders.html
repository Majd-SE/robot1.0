<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070707">
  <title>Reminders | ROBOT.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="robotMenu"></div>
<main class="page-shell">
  <header class="page-header">
    <div><p class="eyebrow">PRODUCTIVITY</p><h1>Reminders</h1><p class="page-description">Keep the small things in view.</p></div>
  </header>
  <section class="glass-card reminder-form">
    <div class="section-heading"><div><p class="eyebrow">ADD REMINDER</p><h2>Plan a moment</h2></div></div>
    <form id="reminderForm">
      <label class="field-label" for="reminderTitle">Reminder title</label>
      <input id="reminderTitle" name="title" type="text" maxlength="100" placeholder="What should you remember?" required>
      <div class="date-fields">
        <div><label class="field-label" for="reminderDate">Date</label><input id="reminderDate" name="date" type="date" required></div>
        <div><label class="field-label" for="reminderTime">Time</label><input id="reminderTime" name="time" type="time" required></div>
      </div>
      <button class="primary-button" type="submit">Add Reminder</button>
    </form>
    <p class="form-note" id="reminderFeedback" aria-live="polite">Reminders are saved on this phone and synced to the robot when connected. The robot stores up to 8.</p>
  </section>
  <section class="history-section">
    <div class="section-heading"><div><p class="eyebrow">UPCOMING REMINDERS</p><h2>Your reminders</h2></div><span class="count-pill" id="reminderCount">0</span></div>
    <div class="reminder-list" id="reminderList"></div>
  </section>
</main>
<script>
const storageKey = 'robot-control-reminders';
let reminders = [];
try {
  reminders = JSON.parse(localStorage.getItem(storageKey) || '[]');
  if (!Array.isArray(reminders)) reminders = [];
} catch { reminders = []; }
const list = document.getElementById('reminderList');
const feedback = document.getElementById('reminderFeedback');

function saveReminders() {
  localStorage.setItem(storageKey, JSON.stringify(reminders));
}

async function syncReminder(payload) {
  if (!window.robotControl || !window.robotControl.isConfigured) {
    feedback.textContent = 'Saved on this phone. Connect the robot on the Status page to sync it to the OLED.';
    return;
  }
  try {
    await window.robotControl.request('/api/reminder', payload);
    feedback.textContent = 'Reminder synced to the ESP32. It is shown on the OLED Reminders screen.';
    feedback.classList.remove('error-text');
  } catch (error) {
    feedback.textContent = `Saved on this phone, but robot sync failed: ${error.message}`;
    feedback.classList.add('error-text');
  }
}

function renderReminders() {
  list.replaceChildren();
  const upcoming = reminders.filter(item => !item.complete).sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
  const done = reminders.filter(item => item.complete);
  const shown = [...upcoming, ...done];
  document.getElementById('reminderCount').textContent = upcoming.length;
  if (!shown.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state glass-card';
    empty.innerHTML = '<span class="empty-mark" aria-hidden="true">＋</span><strong>No reminders yet</strong><span>Add one above and it will appear here and on the robot.</span>';
    list.append(empty);
    return;
  }

  shown.forEach(item => {
    const card = document.createElement('article');
    card.className = `reminder-item glass-card${item.complete ? ' is-complete' : ''}`;
    const check = document.createElement('button');
    check.className = 'complete-button';
    check.type = 'button';
    check.setAttribute('aria-label', item.complete ? 'Mark incomplete' : 'Mark complete');
    check.setAttribute('aria-pressed', String(item.complete));
    check.textContent = item.complete ? '✓' : '';
    check.addEventListener('click', () => {
      item.complete = !item.complete;
      saveReminders();
      renderReminders();
      syncReminder({ operation: item.complete ? 'complete' : 'add', ...item });
    });

    const content = document.createElement('div');
    const title = document.createElement('h3');
    const datetime = document.createElement('p');
    title.textContent = item.title;
    datetime.className = 'reminder-datetime';
    datetime.textContent = `${new Intl.DateTimeFormat(undefined, { dateStyle: 'medium' }).format(new Date(`${item.date}T12:00:00`))} · ${item.time}`;
    content.append(title, datetime);

    const del = document.createElement('button');
    del.className = 'delete-button';
    del.type = 'button';
    del.textContent = 'Delete';
    del.setAttribute('aria-label', `Delete ${item.title}`);
    del.addEventListener('click', () => {
      reminders = reminders.filter(reminder => reminder.id !== item.id);
      saveReminders();
      renderReminders();
      syncReminder({ operation: 'delete', id: item.id });
    });
    card.append(check, content, del);
    list.append(card);
  });
}

document.getElementById('reminderForm').addEventListener('submit', event => {
  event.preventDefault();
  const data = new FormData(event.currentTarget);
  const item = {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    title: String(data.get('title')).trim(),
    date: String(data.get('date')),
    time: String(data.get('time')),
    complete: false
  };
  if (!item.title) return;
  reminders.push(item);
  saveReminders();
  event.currentTarget.reset();
  renderReminders();
  syncReminder({ operation: 'add', ...item });
});

renderReminders();
loadRobotMenu();
async function loadRobotMenu() {
  try {
    const response = await fetch('menu.html');
    if (!response.ok) throw new Error();
    const template = document.createElement('template');
    template.innerHTML = await response.text();
    const menuScript = template.content.querySelector('script');
    if (menuScript) menuScript.remove();
    document.getElementById('robotMenu').replaceChildren(template.content.cloneNode(true));
    if (menuScript) {
      const script = document.createElement('script');
      script.textContent = menuScript.textContent;
      document.body.append(script);
      script.remove();
    }
  } catch {
    document.getElementById('robotMenu').innerHTML = '<p class="menu-error">Navigation could not load. Run this page using VS Code Live Server.</p>';
  }
}
</script>
</body>
</html>
